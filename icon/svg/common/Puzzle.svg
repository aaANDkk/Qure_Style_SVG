<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <title>Puzzle</title>
  <desc>Qure-style optically centered geometric redraw of Puzzle icon; 144x144 canvas with 2px margin.</desc>
  <defs>
    <linearGradient id="pz-orange" gradientUnits="userSpaceOnUse" x1="68" y1="78" x2="14" y2="54">
      <stop offset="0" stop-color="#FFCA4C" />
      <stop offset="0.5" stop-color="#FFB62C" />
      <stop offset="1" stop-color="#FF9A01" />
    </linearGradient>
    <linearGradient id="pz-red" gradientUnits="userSpaceOnUse" x1="64" y1="82" x2="26" y2="132">
      <stop offset="0" stop-color="#F97A56" />
      <stop offset="0.5" stop-color="#EB5133" />
      <stop offset="1" stop-color="#DD280F" />
    </linearGradient>
    <linearGradient id="pz-teal" gradientUnits="userSpaceOnUse" x1="88" y1="82" x2="88" y2="132">
      <stop offset="0" stop-color="#00E0B4" />
      <stop offset="0.5" stop-color="#00BFA2" />
      <stop offset="1" stop-color="#009E90" />
    </linearGradient>
    <linearGradient id="pz-blue" gradientUnits="userSpaceOnUse" x1="126" y1="68" x2="78" y2="18">
      <stop offset="0" stop-color="#1778D2" />
      <stop offset="0.5" stop-color="#29A1E9" />
      <stop offset="1" stop-color="#3BCAFF" />
    </linearGradient>
  </defs>

  <!-- Optically balanced 3-piece assembled base at x=[14.5, 114.5], y=[28.5, 128.5] (50x50 per quadrant) -->
  <g transform="translate(14.5 28.5)">
    <!-- 1. Top-Left Orange piece: right tab OUT, bottom socket IN (0.5px tuck under Red seam to prevent hairline AA gap) -->
    <path fill="url(#pz-orange)"
      d="M15 0 H50 V18.5 C53 15.5 56 14 59.5 14 C65.8 14 70.5 18.8 70.5 25 C70.5 31.2 65.8 36 59.5 36 C56 36 53 34.5 50 31.5 V50.6 H0 V15 C0 6.7 6.7 0 15 0 Z" />

    <!-- 2. Bottom-Left Red piece: top tab OUT (sits cleanly over Orange), right socket IN (0.5px tuck under Teal) -->
    <path fill="url(#pz-red)"
      d="M0 50 H18.5 C15.5 47 14 44 14 40.5 C14 34.2 18.8 29.5 25 29.5 C31.2 29.5 36 34.2 36 40.5 C36 44 34.5 47 31.5 50 H50.6 V100 H15 C6.7 100 0 93.3 0 85 Z" />

    <!-- 3. Bottom-Right Teal piece: left tab OUT (sits cleanly over Red), top socket IN -->
    <path fill="url(#pz-teal)"
      d="M50 50 H68.5 C65.5 53 64 56 64 59.5 C64 65.8 68.8 70.5 75 70.5 C81.2 70.5 86 65.8 86 59.5 C86 56 84.5 53 81.5 50 H100 V85 C100 93.3 93.3 100 85 100 H50 V81.5 C47 84.5 44 86 40.5 86 C34.2 86 29.5 81.2 29.5 75 C29.5 68.8 34.2 64 40.5 64 C44 64 47 65.5 50 68.5 Z" />
  </g>

  <!-- 4. Detached Top-Right Blue piece: left socket IN, bottom tab OUT, tilted -29 deg reaching exact R=2 -->
  <g transform="translate(73.4 24.4) rotate(-29)">
    <path fill="url(#pz-blue)"
      d="M0 0 H35 C43.3 0 50 6.7 50 15 V50 H31.5 C34.5 53 36 56 36 59.5 C36 65.8 31.2 70.5 25 70.5 C18.8 70.5 14 65.8 14 59.5 C14 56 15.5 53 18.5 50 H0 V31.5 C3 34.5 6 36 9.5 36 C15.8 36 20.5 31.2 20.5 25 C20.5 18.8 15.8 14 9.5 14 C6 14 3 15.5 0 18.5 Z" />
  </g>
</svg>
