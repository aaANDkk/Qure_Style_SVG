<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <title>LinYun</title>
  <desc>Qure-style glassmorphic cloud vector redraw of LinYun emblem; 144x144 canvas with 2px margin.</desc>
  <defs>
    <clipPath id="ly-cloud-clip" clipPathUnits="userSpaceOnUse">
      <path d="M35 121 C16.5 121 2 106.5 2 88.5 C2 72.2 14.0 58.6 29.8 56.4 C33.5 37.2 50.4 23 70.5 23 C91.8 23 109.4 39.0 111.8 59.8 C128.8 61.6 142 75.8 142 93 C142 108.5 129.5 121 114 121 Z" />
    </clipPath>
    <linearGradient id="ly-base" gradientUnits="userSpaceOnUse" x1="48" y1="24" x2="96" y2="122">
      <stop offset="0" stop-color="#ECEFFF" />
      <stop offset="0.45" stop-color="#D7E6FF" />
      <stop offset="0.82" stop-color="#A8CEFF" />
      <stop offset="1" stop-color="#6CB2FF" />
    </linearGradient>
    <radialGradient id="ly-dome-glow" gradientUnits="userSpaceOnUse" cx="78" cy="46" r="46">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.88" />
      <stop offset="0.6" stop-color="#E5EDFF" stop-opacity="0.35" />
      <stop offset="1" stop-color="#A5BFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ly-front-puff" gradientUnits="userSpaceOnUse" x1="10" y1="68" x2="62" y2="121">
      <stop offset="0" stop-color="#E4E9FF" stop-opacity="0.82" />
      <stop offset="0.55" stop-color="#B0C7FF" stop-opacity="0.72" />
      <stop offset="1" stop-color="#89B2FF" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="ly-wave" gradientUnits="userSpaceOnUse" x1="48" y1="118" x2="136" y2="92">
      <stop offset="0" stop-color="#53A4FF" stop-opacity="0.85" />
      <stop offset="0.5" stop-color="#65B8FF" stop-opacity="0.92" />
      <stop offset="1" stop-color="#8FD4FF" stop-opacity="0.78" />
    </linearGradient>
    <linearGradient id="ly-rim" gradientUnits="userSpaceOnUse" x1="18" y1="24" x2="126" y2="120">
      <stop offset="0" stop-color="#C8D2FA" />
      <stop offset="0.5" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#6EB6FF" />
    </linearGradient>
  </defs>

  <g clip-path="url(#ly-cloud-clip)">
    <rect x="0" y="0" width="144" height="144" fill="url(#ly-base)" />
    <circle cx="76" cy="54" r="44" fill="url(#ly-dome-glow)" />
    <!-- Translucent lower-left frosted bubble -->
    <path d="M0 78 C6 58 24 54 38 66 C56 82 76 106 104 106 C118 106 132 100 144 90 V124 H0 Z" fill="url(#ly-front-puff)" />
    <!-- Luminous crystal-blue bottom-right reflection wave -->
    <path d="M40 122 C62 114 82 96 108 93 C124 91 136 96 142 104 V124 H40 Z" fill="url(#ly-wave)" />
    <!-- Soft glass specular ribbon highlight -->
    <path d="M10 74 C22 57 40 62 56 80 C72 98 94 106 124 94" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-opacity="0.72" stroke-linecap="round" />
  </g>
  <!-- Crisp subtle glass edge rim -->
  <path d="M35 120.2 C16.9 120.2 2.8 106.1 2.8 88.5 C2.8 72.6 14.5 59.3 30.0 57.1 L30.5 57.0 L30.6 56.5 C34.2 37.7 50.8 23.8 70.5 23.8 C91.4 23.8 108.6 39.5 111.0 59.9 L111.1 60.5 L111.7 60.6 C128.4 62.3 141.2 76.2 141.2 93 C141.2 108.0 129.0 120.2 114 120.2 Z" fill="none" stroke="url(#ly-rim)" stroke-width="1.6" />
</svg>
