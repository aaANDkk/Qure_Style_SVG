<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <title>KenDeJi</title>
  <desc>Qure-style smooth native vector redraw of KenDeJi cyberpunk circuit rooster; 144x144 canvas with 2px margin.</desc>
  <defs>
    <linearGradient id="kendeji-grad" gradientUnits="userSpaceOnUse" x1="22" y1="16" x2="122" y2="132">
      <stop offset="0" stop-color="#625AFF" />
      <stop offset="0.55" stop-color="#8E3AF0" />
      <stop offset="1" stop-color="#BD25CE" />
    </linearGradient>
    <clipPath id="kdj-inner-clip" clipPathUnits="userSpaceOnUse">
      <circle cx="72" cy="72" r="67.5" />
    </clipPath>
    <mask id="kdj-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="144" height="144">
      <rect x="0" y="0" width="144" height="144" fill="#000000" />
      <!-- Perfect outer ring (R_mid=67.3, sw=5.4 -> outer radius exactly 70.0 -> [2, 142]) -->
      <circle cx="72" cy="72" r="67.3" fill="none" stroke="#FFFFFF" stroke-width="5.4" />

      <g clip-path="url(#kdj-inner-clip)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
        <!-- Rooster Comb (4 crisp pointed crests + sweeping brow arch) -->
        <path stroke-width="4.9" stroke-linejoin="miter" stroke-miterlimit="3.2" d="M97.2 58.6 C106.5 52.2 108.5 39.2 98.2 31.4 C95.8 29.6 93.6 28.1 91.6 27.0 L88.8 38.4 C84.6 30.0 77.4 22.8 69.2 18.8 L70.8 32.0 C64.2 26.8 57.6 24.4 51.0 23.6 L55.2 38.6 C49.4 37.2 44.2 35.8 38.6 35.2 C38.8 47.4 45.6 54.4 54.4 53.2 C66.2 44.6 84.8 44.8 97.2 58.6 Z" />

        <!-- Main Head / Neck Diagonal Outer Line curving over brow -->
        <path stroke-width="5.0" d="M21.0 120.5 L48.2 71.2 C57.2 55.2 76.2 49.4 89.2 58.2" />

        <!-- Eye Socket (crisp smooth C-curve + right horizontal spur) -->
        <path stroke-width="4.8" d="M87.4 58.2 C82.0 57.0 78.6 60.4 79.4 64.4 C80.2 68.0 84.8 68.8 89.0 66.2 L94.2 65.8" />

        <!-- Sharp Pointed Beak (smooth filled-like clean stroke + wedge) -->
        <path fill="#FFFFFF" stroke="none" d="M98.5 62.6 C106.8 64.8 113.4 68.8 117.2 73.6 C117.8 74.4 117.4 75.5 116.4 75.6 C108.4 76.0 101.6 77.2 95.8 79.0 L94.0 74.4 C99.2 72.8 104.2 71.8 109.2 71.4 C105.6 69.2 101.6 67.6 97.2 66.8 Z" />

        <!-- Throat & Chest Inner Contour sweeping cleanly to lower-right ring -->
        <path stroke-width="5.0" d="M91.6 79.2 C83.2 84.2 80.2 95.8 84.2 105.0 C86.4 109.8 90.0 112.4 93.8 114.2 C96.4 120.0 97.4 127.6 97.4 136.5" />

        <!-- Classic Teardrop Wattle -->
        <path stroke-width="5.0" d="M99.8 83.2 C106.2 91.6 107.6 101.0 101.8 105.4 C96.8 109.2 90.0 105.2 89.4 98.4 C89.0 94.2 90.4 90.8 92.2 88.2" />

        <!-- Circuit Trace 1 (leftmost short trace to Node 1) -->
        <path stroke-width="4.7" d="M33.2 131.5 L44.2 110.2 V102.0" />

        <!-- Circuit Trace 2 (tall diagonal trace to Node 2 at neck/cheek) -->
        <path stroke-width="4.7" d="M40.5 135.0 L54.0 111.5 V79.5 L67.6 65.8" />

        <!-- Circuit Trace 3 (center-left vertical trace to Node 3) -->
        <path stroke-width="4.7" d="M49.5 138.0 L64.0 114.2 V93.8" />

        <!-- Circuit Trace 4 (curved inner neck + center vertical stem to bottom ring) -->
        <path stroke-width="4.8" d="M66.2 68.5 C63.6 77.0 69.8 85.4 79.2 85.2 C75.2 90.4 73.5 96.2 73.5 103.5 V119.5 L64.2 138.5" />

        <!-- Circuit Trace 5 (bottom-right short trace to Node 4) -->
        <path stroke-width="4.7" d="M84.0 139.0 C85.8 133.5 86.2 128.8 85.0 124.2" />

        <!-- 4 Crisp Geometric Circuit Node Rings (outer white circles) -->
        <circle cx="44.2" cy="98.2" r="5.2" fill="#FFFFFF" stroke="none" />
        <circle cx="70.2" cy="63.2" r="5.2" fill="#FFFFFF" stroke="none" />
        <circle cx="64.0" cy="90.0" r="5.2" fill="#FFFFFF" stroke="none" />
        <circle cx="84.4" cy="121.2" r="5.2" fill="#FFFFFF" stroke="none" />

        <!-- Hollow centers punched cleanly out of the 4 circuit node rings -->
        <circle cx="44.2" cy="98.2" r="2.1" fill="#000000" stroke="none" />
        <circle cx="70.2" cy="63.2" r="2.1" fill="#000000" stroke="none" />
        <circle cx="64.0" cy="90.0" r="2.1" fill="#000000" stroke="none" />
        <circle cx="84.4" cy="121.2" r="2.1" fill="#000000" stroke="none" />
      </g>
    </mask>
  </defs>

  <rect x="0" y="0" width="144" height="144" fill="url(#kendeji-grad)" mask="url(#kdj-mask)" />
</svg>
