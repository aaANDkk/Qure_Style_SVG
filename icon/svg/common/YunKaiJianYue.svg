<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <title>YunKaiJianYue</title>
  <desc>Qure-style vector redraw of YunKaiJianYue rocket &amp; clouds emblem; 144x144 canvas with 2px margin.</desc>
  <defs>
    <linearGradient id="yk-cloud-back" gradientUnits="userSpaceOnUse" x1="16" y1="6" x2="54" y2="54">
      <stop offset="0" stop-color="#E4F2FC" />
      <stop offset="0.6" stop-color="#C6E2F7" />
      <stop offset="1" stop-color="#9AC6EC" />
    </linearGradient>
    <linearGradient id="yk-cloud-front" gradientUnits="userSpaceOnUse" x1="88" y1="68" x2="124" y2="134">
      <stop offset="0" stop-color="#C0E0FC" />
      <stop offset="0.55" stop-color="#96C6F7" />
      <stop offset="1" stop-color="#75AEED" />
    </linearGradient>
    <linearGradient id="yk-body" gradientUnits="userSpaceOnUse" x1="50" y1="72" x2="94" y2="72">
      <stop offset="0" stop-color="#CBD8E0" />
      <stop offset="0.35" stop-color="#9FB2BE" />
      <stop offset="0.72" stop-color="#78909C" />
      <stop offset="1" stop-color="#546E7A" />
    </linearGradient>
    <linearGradient id="yk-red" gradientUnits="userSpaceOnUse" x1="50" y1="20" x2="96" y2="112">
      <stop offset="0" stop-color="#FF5A43" />
      <stop offset="0.55" stop-color="#E53928" />
      <stop offset="1" stop-color="#B71C1C" />
    </linearGradient>
    <linearGradient id="yk-flame-outer" gradientUnits="userSpaceOnUse" x1="72" y1="106" x2="72" y2="148">
      <stop offset="0" stop-color="#FF7043" />
      <stop offset="0.5" stop-color="#FFA726" />
      <stop offset="1" stop-color="#FFEE58" />
    </linearGradient>
    <linearGradient id="yk-flame-inner" gradientUnits="userSpaceOnUse" x1="72" y1="108" x2="72" y2="138">
      <stop offset="0" stop-color="#FFFDE7" />
      <stop offset="1" stop-color="#FFE082" />
    </linearGradient>
  </defs>

  <g transform="translate(0 3)">
  <!-- Soft background cloud (upper-left) -->
  <path fill="url(#yk-cloud-back)" d="M18 47 C9 47 2 41 2 33 C2 26 7.5 20.5 14.5 20 C16 14 21 10 27 10 C31 5 38 3 44.5 5.5 C50 7.5 54 12.5 55 18.5 C63 19.5 69 26 69 34 C69 42 62.5 48 54 48 C50 51.5 44 53 38 51.5 C34 52 29 50.5 26 47 Z" />

  <!-- Tilted 44-deg symmetric metallic rocket -->
  <g transform="rotate(44 74 71)">
    <!-- Exhaust flame -->
    <path fill="url(#yk-flame-outer)" d="M62 110 C56 122 57 136 72 152 C87 136 88 122 82 110 Z" />
    <path fill="url(#yk-flame-inner)" d="M66 111 C63 120 64 129 72 140 C80 129 81 120 78 111 Z" />

    <!-- Left & right crimson rocket fins -->
    <path fill="url(#yk-red)" d="M53 74 C36 84 31 100 32 121 L54 106 Z" />
    <path fill="url(#yk-red)" d="M91 74 C108 84 113 100 112 121 L90 106 Z" />

    <!-- Thruster nozzle collar -->
    <path fill="#455A64" d="M58 106 H86 L82 114 H62 Z" />

    <!-- Sleek steel fuselage -->
    <path fill="url(#yk-body)" d="M72 0 C88 18 95 44 94 74 C93.5 89 90 100 86 107 H58 C54 100 50.5 89 50 74 C49 44 56 18 72 0 Z" />

    <!-- Glossy fuselage highlight stripe -->
    <path fill="#EBF4FA" opacity="0.55" d="M68 12 C60 28 56 50 57 76 L64 76 C63.5 50 66 28 70 12 Z" />

    <!-- Crimson nose cone clipped cleanly to rocket tip -->
    <path fill="url(#yk-red)" d="M72 0 C82.5 11.5 89 26 92 42 C82 37 62 37 52 42 C55 26 61.5 11.5 72 0 Z" />
    <path fill="#FF8A65" opacity="0.45" d="M71 4 C64 14 59 26 57 38 L63 36 C64.5 25 67.5 14 71 4 Z" />

    <!-- Center vertical fin -->
    <path fill="url(#yk-red)" d="M72 78 C75 84 76 96 76 118 H68 C68 96 69 84 72 78 Z" />

    <!-- Porthole window with metallic ring & specular highlight -->
    <circle cx="72" cy="60" r="13.5" fill="#ECEFF1" stroke="#607D8B" stroke-width="2.2" />
    <circle cx="72" cy="60" r="9.6" fill="#263848" />
    <path d="M66 56 A7 7 0 0 1 76 53" fill="none" stroke="#90CAF9" stroke-width="2.2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Fluffy foreground sky-blue cloud (lower-right) -->
  <path fill="url(#yk-cloud-front)" opacity="0.92" d="M72 117 C63 117 57 110 58 101 C59 94 64 89 71 88 C74 75 86 67 99 69 C110 70.5 119 79 121 90 C132 91 142 100 142 111 C142 122 132 131 120 131 C114 134 106 135 99 132 C92 134 84 132 79 126 C76 124 73.5 121 72 117 Z" />
  <path fill="#E3F2FD" opacity="0.42" d="M76 95 C79 81 91 74 103 76 C111 77.5 117 83 119 91 C106 89 90 92 76 95 Z" />
  </g>
</svg>
