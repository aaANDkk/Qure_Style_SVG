<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <title>KittyNetwork</title>
  <desc>Qure-style frameless chibi catgirl mascot redraw of KittyNetwork; 144x144 canvas with 2px margin.</desc>
  <defs>
    <linearGradient id="kn-hair-main" gradientUnits="userSpaceOnUse" x1="72" y1="12" x2="72" y2="122">
      <stop offset="0" stop-color="#E49098" />
      <stop offset="0.45" stop-color="#C46A75" />
      <stop offset="1" stop-color="#8F3F4D" />
    </linearGradient>
    <linearGradient id="kn-hair-back" gradientUnits="userSpaceOnUse" x1="72" y1="36" x2="72" y2="126">
      <stop offset="0" stop-color="#A54F5C" />
      <stop offset="1" stop-color="#6F2B38" />
    </linearGradient>
    <linearGradient id="kn-ear-outer" gradientUnits="userSpaceOnUse" x1="72" y1="14" x2="72" y2="56">
      <stop offset="0" stop-color="#E5ABA4" />
      <stop offset="0.55" stop-color="#BE7276" />
      <stop offset="1" stop-color="#8C434E" />
    </linearGradient>
    <linearGradient id="kn-skin" gradientUnits="userSpaceOnUse" x1="72" y1="38" x2="72" y2="112">
      <stop offset="0" stop-color="#FFF7F0" />
      <stop offset="0.72" stop-color="#FFE6D8" />
      <stop offset="1" stop-color="#F8CEBE" />
    </linearGradient>
    <linearGradient id="kn-eye-iris" gradientUnits="userSpaceOnUse" x1="0" y1="62" x2="0" y2="85">
      <stop offset="0" stop-color="#221942" />
      <stop offset="0.38" stop-color="#533D8B" />
      <stop offset="0.74" stop-color="#B072A8" />
      <stop offset="1" stop-color="#F7C278" />
    </linearGradient>
    <radialGradient id="kn-bell" gradientUnits="userSpaceOnUse" cx="69" cy="123" r="11">
      <stop offset="0" stop-color="#FFF3B0" />
      <stop offset="0.55" stop-color="#FFC847" />
      <stop offset="1" stop-color="#D48619" />
    </radialGradient>
    <linearGradient id="kn-ribbon" gradientUnits="userSpaceOnUse" x1="48" y1="114" x2="96" y2="136">
      <stop offset="0" stop-color="#FF9CA8" />
      <stop offset="1" stop-color="#E05C70" />
    </linearGradient>
  </defs>

  <g transform="translate(72 72) scale(1.060) translate(-72 -71.7)">
  <!-- Back wavy rose-chestnut bob volume (framing cheeks gently) -->
  <path fill="url(#kn-hair-back)" stroke="#682C38" stroke-width="2.6" stroke-linejoin="round"
    d="M27 64 C16 82 14 106 28 119 C39 127 56 126 72 126 C88 126 105 127 116 119 C130 106 128 82 117 64 C112 42 96 24 72 24 C48 24 32 42 27 64 Z" />

  <!-- Cute dark maid choker + ruffled collar ribbon + gleaming golden bell -->
  <path fill="url(#kn-ribbon)" stroke="#682C38" stroke-width="2.4" stroke-linejoin="round"
    d="M48 121 C44 127 46 135 54 134 C60 133 65 129 72 127 C79 129 84 133 90 134 C98 135 100 127 96 121 C88 118 56 118 48 121 Z" />
  <rect x="61" y="102" width="22" height="19" rx="9" fill="url(#kn-skin)" stroke="#8F4B52" stroke-width="2.0" />
  <path d="M55 116 Q72 124 89 116" fill="none" stroke="#45232B" stroke-width="5.6" stroke-linecap="round" />
  <circle cx="72" cy="126.5" r="9.2" fill="url(#kn-bell)" stroke="#7A4414" stroke-width="2.4" />
  <path d="M64.2 128.5 Q72 132 79.8 128.5" fill="none" stroke="#8C4F16" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="72" cy="130" r="1.9" fill="#6E3B0E" />
  <ellipse cx="68.5" cy="122.5" rx="2.6" ry="1.6" fill="#FFFFFF" opacity="0.82" transform="rotate(-24 68.5 122.5)" />

  <!-- Large fluffy pointed cat ears (left & right symmetric) -->
  <path fill="url(#kn-ear-outer)" stroke="#682C38" stroke-width="2.8" stroke-linejoin="round"
    d="M36 53 C21 44 10 29 9.5 19.5 C20 15.5 39 17.5 55 29 Z" />
  <path fill="#FFF4E3" d="M35 50 C25 43 18 33 17.5 26 C26 24.5 38 27 48 34 Z" />
  <path fill="#FFE0D8" opacity="0.55" d="M35 48 C27 42 22 35 22 30 C29 29.5 38 32 45 37 Z" />

  <path fill="url(#kn-ear-outer)" stroke="#682C38" stroke-width="2.8" stroke-linejoin="round"
    d="M108 53 C123 44 134 29 134.5 19.5 C124 15.5 105 17.5 89 29 Z" />
  <path fill="#FFF4E3" d="M109 50 C119 43 126 33 126.5 26 C118 24.5 106 27 96 34 Z" />
  <path fill="#FFE0D8" opacity="0.55" d="M109 48 C117 42 122 35 122 30 C115 29.5 106 32 99 37 Z" />

  <!-- Soft chibi face oval -->
  <path fill="url(#kn-skin)" stroke="#8F4B52" stroke-width="2.4" stroke-linejoin="round"
    d="M35 67 C35 42 109 42 109 67 C109 94 94 111.5 72 112.5 C50 111.5 35 94 35 67 Z" />

  <!-- Warm rosy cheek blushes -->
  <ellipse cx="47.5" cy="91.5" rx="8.5" ry="4.6" fill="#FF98AC" opacity="0.52" />
  <ellipse cx="96.5" cy="91.5" rx="8.5" ry="4.6" fill="#FF98AC" opacity="0.52" />

  <!-- Sparkling violet-amber anime eyes (left & right) -->
  <g>
    <ellipse cx="54.5" cy="76.5" rx="9.8" ry="11.2" fill="#FFFFFF" />
    <ellipse cx="55.5" cy="77.2" rx="8.2" ry="9.8" fill="url(#kn-eye-iris)" />
    <ellipse cx="55.8" cy="76.5" rx="4.2" ry="5.0" fill="#1F153D" />
    <circle cx="52.2" cy="72.4" r="3.4" fill="#FFFFFF" />
    <circle cx="59.2" cy="81.6" r="1.7" fill="#FFF0C8" />
    <path d="M43.5 72.5 C47.5 64.5 60 63.8 65.5 70.5" fill="none" stroke="#3B1D2C" stroke-width="3.6" stroke-linecap="round" />
    <path d="M45 73.5 L41.5 70.2" fill="none" stroke="#3B1D2C" stroke-width="2.4" stroke-linecap="round" />

    <ellipse cx="89.5" cy="76.5" rx="9.8" ry="11.2" fill="#FFFFFF" />
    <ellipse cx="88.5" cy="77.2" rx="8.2" ry="9.8" fill="url(#kn-eye-iris)" />
    <ellipse cx="88.2" cy="76.5" rx="4.2" ry="5.0" fill="#1F153D" />
    <circle cx="85.2" cy="72.4" r="3.4" fill="#FFFFFF" />
    <circle cx="92.2" cy="81.6" r="1.7" fill="#FFF0C8" />
    <path d="M100.5 72.5 C96.5 64.5 84 63.8 78.5 70.5" fill="none" stroke="#3B1D2C" stroke-width="3.6" stroke-linecap="round" />
    <path d="M99 73.5 L102.5 70.2" fill="none" stroke="#3B1D2C" stroke-width="2.4" stroke-linecap="round" />
  </g>

  <!-- Tiny cute surprised mouth (matching kittynetwork.png) -->
  <ellipse cx="72" cy="98.5" rx="2.2" ry="2.8" fill="#B55B68" />

  <!-- Lush layered front rose-chestnut hair crown, soft curved feathery bangs & bouncy side curls -->
  <path fill="url(#kn-hair-main)" stroke="#682C38" stroke-width="2.5" stroke-linejoin="round"
    d="M72 16 C98 16 116 32 120 57 C124 81 124 103 111 114 C105 119 98 119 96 115 C103 107 107 95 106 78 C105 66 102 58 99 54 Q96 63 93 66 Q91 56 88 50 Q85 60 80 66 Q77 56 74 49 Q71 60 66 67 Q63 56 60 50 Q56 60 51 66 Q49 58 46 53 C42 58 39 66 38 78 C37 95 41 107 48 115 C46 119 39 119 33 114 C20 103 20 81 24 57 C28 32 46 16 72 16 Z" />

  <!-- Playful little top hair cowlick (ahoge) -->
  <path d="M68 17 C65 9 74 5 82 10" fill="none" stroke="#9B4655" stroke-width="3.2" stroke-linecap="round" />

  <!-- Silky anime crown highlight arc -->
  <path d="M44 42 C54 33 90 33 100 42" fill="none" stroke="#FFD6DB" stroke-width="4.2" stroke-linecap="round" opacity="0.72" />
  <path d="M52 46 C60 41 84 41 92 46" fill="none" stroke="#FFF2F4" stroke-width="2.0" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
